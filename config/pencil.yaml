# Pencil-class concept (Rev P0): provisional parameter overlay
# ---------------------------------------------------------------------------
# Same leaf schema as config/parameters.yaml (value, unit, min, max, dist,
# status, source, note); load with stabpen.params.load("config/pencil.yaml").
# Anything not defined here is taken from config/parameters.yaml (v0.4.4):
# hand impedance, tremor and writing kinematics, paper contact, sensing noise.
# Nothing in this file is a measurement of our hardware. Every value is a
# design hypothesis, a manufacturer statement (evidence ledger id) or a
# calculation from one, as its status says.
#
# Origin: user request 2026-09-27 for an Apple-Pencil-class form factor that
# still corrects the ink physically. The physics that shapes this file
# (docs/pencil_concept.md):
#   * any nib stage that moves across the barrel axis must hold the
#     transverse contact load N cos(theta) + friction (COR-01); at N = 1 N,
#     theta 50 deg that is 0.64 N plus 0.15 N of friction;
#   * no actuator that fits a 7.9 mm bore holds 0.64 N with enough stroke
#     (piezo bender blocking force 0.55 N for the 6.15 mm wide PL128.10,
#     AMF-11; a voice coil scaled to the bore needs watts to hold it);
#   * so the writing force is grounded to the barrel through a skid ring on
#     the nose (AMF-11's own implication), and the nib is pressed onto the
#     paper by a light spring only. The stage then sees only the spring
#     force's transverse component and the nib friction.
# ---------------------------------------------------------------------------
meta:
  version: "P0.1.2"
  date: "2026-09-27"
  base: "config/parameters.yaml 0.4.4"
  changelog:
    - "P0.1.2 CAD layout fixed for the analysis findings: plates start 5 mm behind the collar (leaf free span 5 mm, bender tips z 23 mm, clamp z 51-59 mm) and the gimbal moves to z 62 mm, so the lever is 62/45.5 = 1.363; the quad plates sit 2.55 mm off-axis so the snubber frames keep a >= 0.49 mm web; four snubber frames (gaps 237/157/91/46 um tip to clamp) and a PTFE collar liner are in the CAD. Mechanism analysis and simulation re-run on this geometry: nib blocking force 0.329 N, stroke 277 um at the worst-direction design load, 192 Hz; ratios unchanged within 0.02"
    - "P0.1.1 analysis/pencil_mechanisms.py and sim/pencil (model P1) replace the hand estimates: stage = four 2.6 mm PICMA-class plates in a square (push-pull pair per axis, CAD pencil_revPQ), lever 1.38 from the CAD, blocking force 0.325 N and stroke 276 um at the nib under the worst-direction design load, first resonance 192 Hz; decoupling leaf, 10 kHz servo, snubbers and Hall-noise target added; voice coil recomputed with magpylib (Km 0.080 N/sqrtW, hold 2.4 W) and a barrel conduction model (36 K/W, 0.31 W allowable); skid ring radius 1.4 mm (lead, CAD); nib protrusion travel 2.4 mm; nib assembly mass from the CAD; driver topology and haptic channel updated"
    - "P0.1.0 first provisional pencil-class set: Apple Pencil Pro envelope (AMF-41), skid-grounded writing force, low-force nib spring, two custom-width PICMA-class piezo benders in an L arrangement driving a D1-format gel refill through a front collar with a rear gimbal; voice-coil alternative kept for comparison"

envelope:
  od:              {value: 0.0089, unit: m,  min: 0.0085, max: 0.0095, dist: fixed, status: inherited_target, source: "user request 2026-09-27; AMF-41 (Apple Pencil Pro 8.9 mm)", note: "Grip diameter. A flat for anti-roll and charging contacts is allowed (as on Apple Pencil 2 and Pro)."}
  length:          {value: 0.166,  unit: m,  min: 0.150,  max: 0.170,  dist: fixed, status: inherited_target, source: "AMF-41 (166 mm)", note: ""}
  mass_target:     {value: 0.020,  unit: kg, min: 0.015,  max: 0.024,  dist: fixed, status: inherited_target, source: "AMF-41 (19.15 g)", note: "Stretch target 20 g; 24 g is the provisional upper bound until users judge it (EXP-H02)."}
  wall:            {value: 0.0005, unit: m,  min: 0.0004, max: 0.0007, dist: fixed, status: assumed, source: "assumption: glass-filled PA or PC/ABS moulding over a stainless or titanium chassis tube (AMF-42 construction)", note: "Plastic barrel keeps the BLE antenna usable; inner bore 7.9 mm at 0.5 mm."}
  bore:            {value: 0.0079, unit: m,  min: 0.0075, max: 0.0085, dist: fixed, status: calculated, source: "od - 2 wall", note: "Envelope for every internal part, including a 0.2 mm radial assembly clearance."}
  nose_length:     {value: 0.018,  unit: m,  min: 0.012,  max: 0.025,  dist: fixed, status: assumed, source: "Apple-Pencil-like taper", note: "Cone from the barrel to the skid ring."}

skid:               # grounds the user's writing force to the barrel
  ring_radius:     {value: 0.0014, unit: m,  min: 0.0014, max: 0.0020, dist: uniform, status: calculated, source: "mechanics/cad/pencil_revP.py section check: the refill cone clears the skid aperture at 35 deg with +/-0.40 mm nib travel only for r >= 1.4 mm (lead, 2026-09-27)", note: "Radius of the skid contact ring around the nib axis. Sets the nib protrusion range: p >= r cot(theta) = 0.375-2.00 mm over 35-75 deg (analysis/pencil_mechanisms.py)."}
  mu:              {value: 0.12,   unit: "-", min: 0.05,  max: 0.25,   dist: uniform, status: assumed, source: "assumption: PTFE-filled POM on paper; EXP-Q01 measures", note: "Skid-paper friction coefficient; replaces nib friction as the drag the hand feels."}
  theta_min:       {value: 35,     unit: deg, min: 30,    max: 40,     dist: fixed,   status: inherited_target, source: "REQ-ENV-001 (35-75 deg)", note: "Lowest tilt at which the nib must still reach the paper."}

nib:                # writing element and its axial spring
  refill:          {value: "ISO 12757-2 D1-format gel refill (67 x 2.35 mm), metal tube preferred", unit: "-", status: assumed, source: "CON ledger (D1 geometry); DEC-004 lineage", note: "Low-force ink (gel or fineliner) because the nib carries only the spring force; line quality versus force is unmeasured (EXP-Q02)."}
  spring_force:    {value: 0.15,   unit: N,  min: 0.08,   max: 0.30,   dist: uniform, status: assumed, source: "assumption; EXP-Q02 finds the lowest force with an acceptable line per ink", note: "Axial nib force set by a preloaded soft spring; the skid carries the rest of the user's force."}
  spring_rate:     {value: 25.0,   unit: N/m, min: 10.0,  max: 60.0,   dist: uniform, status: assumed, source: "design: 2 mm protrusion range changes the force by 0.05 N", note: ""}
  protrusion_travel: {value: 0.0024, unit: m, min: 0.0021, max: 0.0030, dist: fixed, status: calculated, source: "analysis/pencil_mechanisms.py: tilt range 1.4 mm x (cot 35 - cot 75 deg) = 1.62 mm, plus the axial slide that keeps the ball on the paper while the stage moves in the tilt plane (q cot theta): 2.13 mm at the +/-0.30 mm working stroke, 2.30 mm at the 0.40 mm stops; rounded up", note: "Front stop at 2.06 mm and rear stop at -0.19 mm ball-centre protrusion (exact ball geometry). Axial travel the nib spring must accommodate."}
  mu_nib:          {value: 0.15,   unit: "-", min: 0.05,  max: 0.35,   dist: uniform, status: assumed, source: "writing.mu_eff (parameters.yaml)", note: "Nib-paper drag at the spring force."}
  front_stop:      {value: "tilt-adaptive, 0.30 mm beyond the working protrusion", unit: "-", status: assumed, source: "sim/pencil/diag_touchdown_tails.py (results/pencil/touchdown_tails.json)", note: "Proposal. The P0.1.2 front stop serves the whole tilt range (ball-centre protrusion 2.06 mm); at 50 deg the ball slides up to 0.86 mm at every touchdown and lift, about 1.1 mm of extra ink per stroke against a rigid pen. A 0.30 mm margin cuts it to 0.33 mm (oracle ratio 0.24 -> 0.30). Needs a slow trim actuator (SQUIGGLE class, AMF-15) driven by the IMU tilt; EXP-Q08."}
  mass_moving:     {value: 0.00097, unit: kg, min: 0.0008, max: 0.0014, dist: uniform, status: calculated, source: "CAD mechanics/cad/pencil_revP.py nib assembly 0.968 g (refill 0.84 g as a brass tube with ink, collar 0.10 g, magnets, hub)", note: "Tip-equivalent 0.29 g about the rear gimbal; weigh refills (EXP-B01 part 0)."}
  bushing_mu:      {value: 0.08,   unit: "-", min: 0.04,  max: 0.30,   dist: uniform, status: assumed, source: "assumption: PTFE-lined collar bore and gimbal hub (the CAD collar bore is bare titanium on brass, about 0.3)", note: "The refill slides through two bearings loaded by 1.76 x the transverse nib load: nib-force band +/- mu x 1.76 x R_perp / sin(theta) = +/-0.03 N at the design point (0.3 would give +/-0.12 N). EXP-Q06."}

stage:              # baseline actuator: piezo, two axes (analysis/pencil_mechanisms.py checks every number)
  type:            {value: "four custom-width (2.6 mm) multilayer piezo benders (PICMA class) in a square around the refill, a push-pull pair per axis (CAD variant Q), each tip coupled to a front collar by a decoupling leaf; refill pivots in a rear gimbal", unit: "-", status: calculated, source: "analysis/pencil_mechanisms.py verdict (docs/pencil_mechanisms.md); CAD mechanics/cad/pencil_revP.py --variant Q", note: "The 4.0 mm L pair does not fit (CAD); the 3.5 mm L pair fits but keeps 143 um (25 um at -20 %) under the worst-direction design load against 276 um (160 um) for the quad. PL128.10 as-is: one axis only (bench part)."}
  plates_per_axis: {value: 2,      unit: "-", min: 1,     max: 2,      dist: fixed,   status: calculated, source: "Q layout (push-pull pair per axis; the pair's outer electrodes are swapped so one driver serves both)", note: ""}
  bender_free_length: {value: 0.028, unit: m, min: 0.022, max: 0.034, dist: fixed, status: sourced, source: "AMF-11 PL128.10 (28 mm free length, 36 mm overall)", note: ""}
  bender_width:    {value: 0.0026, unit: m,  min: 0.0026, max: 0.0035, dist: fixed, status: calculated, source: "CAD pencil_revPQ (four plates fit with 0.115 mm plate gap and 0.786 mm bore gap at +/-0.40 mm tip sweep); 3.5 mm is the L-pair fallback (lead CAD message)", note: "Custom width (make: supplier custom part, diced edges to qualify in EXP-Q04). Blocking force scales with width; free stroke does not."}
  bender_thickness: {value: 0.00067, unit: m, min: 0.00055, max: 0.0008, dist: fixed, status: sourced, source: "AMF-11 (0.67 mm)", note: ""}
  bender_free_stroke: {value: 4.5e-4, unit: m, min: 3.6e-4, max: 5.4e-4, dist: uniform, status: sourced, source: "AMF-11 PL128.10 +/-450 um at 0-60 V differential (+/-20 %)", note: "Tip, unloaded, per bender."}
  bender_block_force: {value: 0.2325, unit: N, min: 0.186, max: 0.279, dist: uniform, status: calculated, source: "AMF-11 PL128.10 +/-0.55 N x 2.6/6.15 (+/-20 %)", note: "Tip, per plate. Per axis (pair) 0.465 N at the collar; 0.329 N at the nib through the lever and the leaves."}
  bender_capacitance: {value: 5.07e-7, unit: F, min: 4.06e-7, max: 6.09e-7, dist: uniform, status: calculated, source: "AMF-11 PL128.10 2 x 1.2 uF x 2.6/6.15, per half (small signal, 1 kHz)", note: "Driven centre-electrode load per axis 2.03 uF small signal; power calculations use x1.3 for large signal (assumption, EXP-Q04)."}
  bender_voltage:  {value: 60.0,   unit: V,  min: 60.0,   max: 60.0,   dist: fixed,   status: sourced, source: "AMF-11 (0-60 V, differential control)", note: ""}
  lever:           {value: 1.363,  unit: "-", min: 1.26,  max: 1.45,   dist: fixed,   status: calculated, source: "CAD P0.1.2: gimbal 62 mm behind the ball, collar centre 16.5 mm: 62/45.5", note: "Nib motion per collar motion. Loaded stroke is flat around the optimum n* = F_b,collar/(2F) = 1.37 at 0.170 N (277 um at 1.3, 276 um at 1.4)."}
  travel_nib:      {value: 3.0e-4, unit: m,  min: 2.0e-4, max: 4.0e-4, dist: fixed,   status: assumed, source: "design target; analysis/pencil_mechanisms.py: available 355 um (frictionless design load 0.126 N), 276 um (worst stroke direction 0.170 N), 160 um at -20 % tolerance, 42 um at 35 deg", note: "Usable correction radius at the nib (servo soft limit); stops at 0.40 mm. Simulation (sim_metrics.json): the oracle sits at this limit 28 % (6 Hz) to 65 % (12 Hz) of the time at 0.3 mm tremor."}
  stroke_under_load: {value: 2.77e-4, unit: m, min: 1.62e-4, max: 3.53e-4, dist: fixed, status: calculated, source: "analysis/pencil_mechanisms.py: (F_b,nib - F)/(k_b + k_par) at F = 0.170 N (F_c 0.15 N, 50 deg, mu 0.15, worst stroke direction); min at -20 % tolerance, max frictionless", note: "Symmetric about the housing-fixed centre (roll unknown)."}
  first_resonance: {value: 192.0,  unit: Hz, min: 165.0, max: 215.0, dist: fixed, status: calculated, source: "analysis/pencil_mechanisms.py: lumped 192 Hz, 14-element FE 195 Hz (plates + nib assembly 0.29 g at the nib + leaves)", note: "In air; paper stick raises it in contact. EXP-Q07 FRF."}
  stop_travel_nib: {value: 4.0e-4, unit: m, min: 3.5e-4, max: 4.5e-4, dist: fixed, status: calculated, source: "CAD pencil_revP (nib_travel)", note: "Pushed onto a stop while driven the other way the plate clamp sees 55 MPa (P_fail 7e-5 per event, proposed AMF-48 scaling); unpowered 22 MPa."}
  decoupling_leaf: {value: "C17200 TH04 leaf, 30 um thick, 1.2 mm wide (radial), >= 5 mm free axial span, one per plate", unit: "-", status: calculated, source: "analysis/pencil_mechanisms.py: cross 34 N/m (7 % of the axis), drive 54 kN/m, buckling SF 2.4, 137 MPa at the stops (AMF-18, AMF-19)", note: "In the CAD since P0.1.2 (5 mm span: plates moved back, collar kept at z 15-18 mm for the nose Hall sensor). The first CAD leaf (25 um x 0.45 mm, 1 mm span) gave 1.36 N/mm across (2.6 x the axis stiffness: loaded stroke 84 um) and 4.2 GPa at the stops."}
  snubbers:        {value: "4 snubbers along each plate at 0.2/0.4/0.6/0.8 of the free length, gap = operating deflection shape + 30 um; compliant nose so a 1 m drop pulse lasts >= 2 ms", unit: "-", status: calculated, source: "analysis/pencil_mechanisms.py FE drop simulation (1 m, restitution 0.4, sideways)", note: "Stops alone: 139-604 MPa peak (fracture for pulses < 2 ms); drop test EXP-Q04. In the CAD since P0.1.2 as four PEEK frames per stack (gaps 237/157/91/46 um from tip to clamp, stop-travel cantilever shape + 30 um); the compliant nose is not yet designed."}
  servo_rate:      {value: 10000.0, unit: Hz, min: 5000.0, max: 20000.0, dist: fixed, status: calculated, source: "sim/pencil/run_study.py servo_check: integral 25 Hz + damping (zeta 0.4, 600 Hz filter): PM >= 52 deg, GM 14.8 dB at 10 kHz; at 2 kHz the damping loop keeps only about 6 deg", note: "Inner piezo servo and Hall rate (Hall at >= 10 kSPS assumed); estimator stays at control.f_stage (2 kHz)."}
  position_sensor: {value: "3-D Hall sensor (TMAG5170/TLE493D class, >= 10 kSPS) in the nose facing a 0.6 x 1 x 1 mm NdFeB magnet on the collar", unit: "-", status: calculated, source: "analysis/pencil_mechanisms.py (magpylib): 95-190 mT/mm at centre, 34 mT/mm worst over the travel; 1.4 um (centre) to 4 um (worst) at the nib for 0.1 mT noise (assumed)", note: "Closes the loop around piezo hysteresis and creep; no coil crosstalk. Its noise drives piezo power (see electronics.hall_noise_target)."}

stage_vcm:          # alternative: moving-magnet voice coil scaled to the bore, same lever idea as Rev A
  Km:              {value: 0.080,  unit: N/sqrt(W), min: 0.060, max: 0.10, dist: uniform, status: calculated, source: "analysis/pencil_mechanisms.py: magpylib, analysis/em_planar.py topology in a 7.5 mm envelope, best of 12 designs (n 1.38, 0.55 mm coils, 2.0 mm magnet): Km_min 0.080, Km_centre 0.093 N/sqrtW; image iron = upper bound", note: "Holding the 0.170 N design load costs 2.4 W (0.8 W at the frictionless 0.126 N; 66 W without the skid). Supersedes the length^1.5 hand estimate (0.13)."}
  lever:           {value: 1.38,   unit: "-", min: 1.0,   max: 2.0,    dist: fixed,   status: calculated, source: "magpylib sweep n = 1.0/1.38/2.0 (n = 3.17 does not fit: the paddle sweep leaves no room for the coil sides in the 7.9 mm bore)", note: "Best n x Km_min."}
  Rth_coil:        {value: 36.0,   unit: K/W, min: 25.0,  max: 60.0,   dist: uniform, status: calculated, source: "analysis/pencil_mechanisms.py: 1-D barrel conduction model (PA-GF30 over 0.15 mm stainless, h 10 W/m2K, fingers 600 W/m2K on the grip) with fixed coils bonded at R_int 10 K/W (assumed), coil at z = 29 mm", note: "Coil to ambient. Allowable 0.31 W (41 C surface, 120 C coil) against 2.4 W needed. Supersedes the 580 K/W moving-coil scaling."}

electronics:
  soc:             {value: "nRF54L15 CSP47 (2.45 x 2.25 mm)", unit: "-", status: sourced, source: "AMF-44", note: ""}
  board_width:     {value: 0.0055, unit: m,  min: 0.0050, max: 0.0060, dist: fixed, status: assumed, source: "chord of the 7.9 mm bore at 2.5 mm from the axis, with components on both sides", note: "Rigid-flex, 6-8 layers HDI."}
  p_active:        {value: 0.065,  unit: W,  min: 0.040,  max: 0.120,  dist: uniform, status: assumed, source: "SoC with BLE about 10 mW (AMF-44), IMU 2 mW, Hall 3 mW, optics 50 mW placeholder (sensing.opt_*)", note: "Excludes the piezo drive; measure (EXP-P01)."}
  piezo_driver:    {value: "prototype: 2 x DRV2700 at 60 V (AMF-16); product: shared low-Iq boost (LT8330 class, about 55 V) + 2 charge-recovery half-bridge stages, or a CapDrive part qualified at 2-2.6 uF", unit: "-", status: calculated, source: "analysis/pencil_mechanisms.py and sim_metrics.json: DRV2700 quiescent 72 mW (9.8 mA x 2 at 60 V); tremor assist 0.5-0.9 h per charge with DRV2700 vs 2.0-2.8 h with charge recovery (1 um Hall noise), 3.3-3.6 h at 0.3 um", note: "LT8330: proposed AMF-47 (Iq 6 uA, 60 V switch). BOS1921/1931: proposed AMF-46 (energy recovery, but rated <= 820 nF). A 55 V rail costs 17 % of the loaded stroke (228 vs 276 um). EXP-Q05."}
  hall_noise_target: {value: 3.0e-7, unit: m, min: 1.0e-7, max: 1.0e-6, dist: fixed, status: calculated, source: "sim/pencil/run_study.py: at 1 um rms (sensing.hall_noise_tip) the servo turns sensor noise into ~110 mW of class-B drive power (24 mW with charge recovery); 0.3 um cuts it to ~30 mW (8 mW)", note: "Stage-position noise at the nib per 10 kSPS sample; meet by sensor choice, averaging, or an observer-based damping loop."}

battery:
  capacity_mAh:    {value: 90,     unit: mAh, min: 50,    max: 120,    dist: uniform, status: assumed, source: "AMF-42 (Apple Pencil 50 mAh to 0.329 Wh); custom 6.5 x 40 mm Li-ion cylinder; fallback 3 x Panasonic CG-425A (AMF-43)", note: "Pulse discharge for the piezo driver to qualify (EXP-Q03)."}
  v_nom:           {value: 3.7,    unit: V,   min: 3.6,   max: 3.8,    dist: fixed,   status: sourced, source: "Li-ion", note: ""}
  usable_fraction: {value: 0.8,    unit: "-", min: 0.7,   max: 0.9,    dist: fixed,   status: assumed, source: "battery.usable_fraction (parameters.yaml)", note: ""}
  diameter:        {value: 0.0065, unit: m,   min: 0.0047, max: 0.0070, dist: fixed,  status: assumed, source: "bore minus wrap and clearance", note: ""}
  length:          {value: 0.040,  unit: m,   min: 0.030, max: 0.050,  dist: fixed,   status: assumed, source: "space budget (mechanics/cad/pencil_revP.py)", note: ""}

haptics:
  channel:         {value: "piezo nib stage bursts at 200 Hz; 6 mm coin LRA optional", unit: "-", status: calculated, source: "analysis/pencil_mechanisms.py: stage reaction 0.63 g x w^2 x A on a 13.3 g pen: 0.54 Grms at 0.1 mm and 1.6 Grms at 0.3 mm (pen up; 35-45 dB above the 200 Hz threshold, HAP-27), 0.11 Grms at 20 um in contact (21 dB); a 6 mm LRA gives 3.4-6.8 Grms (AMF-45, jig mass assumed)", note: "Stage cues must stay near 20 um in contact to keep the ink wiggle inside the line; use for cues at the travel limit and for guided-mode prompts."}

ai:
  device_horizon:  {value: 0.10,   unit: s,   min: 0.05,  max: 0.20,   dist: uniform, status: assumed, source: "on-device stroke predictor (ml/, ICD s5 contract)", note: "How far ahead the pen predicts its own stroke."}
  template_lead:   {value: 0.30,   unit: s,   min: 0.15,  max: 0.60,   dist: uniform, status: assumed, source: "app-side letter prediction plus BLE latency (about 30 ms)", note: "How far ahead of the nib an AI-predicted template must arrive for guided mode."}
  confidence_full: {value: 0.8,    unit: "-", min: 0.6,   max: 0.95,   dist: uniform, status: assumed, source: "ICD s5 guard rule 5 (c_full)", note: "Prediction confidence at which guidance reaches full authority."}
